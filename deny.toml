[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained but not vulnerable; pulled in by utoipa-axum.
    "RUSTSEC-2024-0436",
    # zip < 9: all three are in ZipArchive::extract() / ZipStreamReader::extract()
    # (SUID bits kept, symlinks followed out of the target dir). Arcagrad never
    # extracts archives to disk; it reads entries in memory. The other copy (zip 3)
    # is a build-dependency of utoipa-swagger-ui unpacking its own pinned release.
    # Remove once zip is >= 9 (entry names decode differently there, which changes
    # zip deep hashes, so that upgrade needs its own migration).
    { id = "RUSTSEC-2026-0367", reason = "extract() only; arcagrad never extracts archives" },
    { id = "RUSTSEC-2026-0368", reason = "extract() only; arcagrad never extracts archives" },
    { id = "RUSTSEC-2026-0369", reason = "extract() only; arcagrad never extracts archives" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# New licenses require explicit review.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # Mozilla CA root data from webpki-roots.
    "CDLA-Permissive-2.0",
    # File-level copyleft from wasmtime/cranelift.
    "MPL-2.0",
]

# The allowlist applies to dependencies, not unpublished workspace crates.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
